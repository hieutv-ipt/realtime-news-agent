app:
  name: realtime-news-agent
  version: "1.0.0"
  description: Realtime news aggregation and analysis agent powered by Claude

agent:
  system_prompt_categories: "politics, finance, daily_life, technology, world, vietnam, entertainment, other"
  importance_scale: "1 (trivial) to 10 (breaking/critical)"

sources:
  rss:
    # ── International ────────────────────────────────────────────────────────
    - name: BBC World
      url: https://feeds.bbci.co.uk/news/world/rss.xml
    - name: BBC Technology
      url: https://feeds.bbci.co.uk/news/technology/rss.xml
    - name: BBC Business
      url: https://feeds.bbci.co.uk/news/business/rss.xml
    - name: NYT Home
      url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml

    # ── Vietnam ──────────────────────────────────────────────────────────────
    - name: VnExpress Thời sự
      url: https://vnexpress.net/rss/tin-tuc-thoi-su.rss
    - name: VnExpress Kinh doanh
      url: https://vnexpress.net/rss/kinh-doanh.rss
    - name: VnExpress Thế giới
      url: https://vnexpress.net/rss/the-gioi.rss
    - name: VnExpress Đời sống
      url: https://vnexpress.net/rss/doi-song.rss

    # ── Finance / Crypto ─────────────────────────────────────────────────────
    # CoinDesk RSS (uncomment if needed)
    # - name: CoinDesk
    #   url: https://www.coindesk.com/arc/outboundfeeds/rss/

    # ── Optional / RSSHub placeholders (comment-only — requires own instance) ─
    # - name: Tuoi Tre (via RSSHub)
    #   url: https://rsshub.app/tuoitre/latest
    # - name: Thanh Nien (via RSSHub)
    #   url: https://rsshub.app/thanhnien/news/thoi-su

cache:
  article_ttl_seconds: 3600
  analysis_ttl_seconds: 86400
